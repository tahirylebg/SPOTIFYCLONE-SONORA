server.port=8080

# Dossier scanné au démarrage (relatif au dossier de lancement, ou absolu).
sonora.music-dir=../music
# Où l'historique d'écoute est sauvegardé.
sonora.data-dir=${user.home}/.sonora
# Origines autorisées à appeler l'API depuis un navigateur (site en dev, Expo web…).
sonora.cors-origins=http://localhost:5173,http://localhost:8081

spring.jackson.default-property-inclusion=non_null
